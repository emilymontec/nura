[project]
name = "nura-shared"
version = "0.1.0"
authors = [
  { name="NURA Team" }
]
description = "Shared utilities for NURA microservices"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0"
]
