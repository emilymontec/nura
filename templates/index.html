{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02040a">
  <title>Nura Intelligence — Plataforma de BI Autónomo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'styles/main.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-ambient"></div>
  <canvas id="nodeCanvas"></canvas>

  <div id="app">
    {% include "views/chat.html" %}
  </div>

  <script>
    window.NURA_CONFIG = {
      apiBaseUrl: "/api",
    };

    window.addEventListener("DOMContentLoaded", () => {
      initializeDashboard();
    });

    // ── ANIMACIÓN DE CANVAS DE NODOS (DESDE LA REFERENCIA) ──
    (function(){
      var c = document.getElementById('nodeCanvas');
      if (!c) return;
      var ctx = c.getContext('2d');
      
      function resize(){
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var N = 20; 
      var nodes = [];
      for(var i=0; i<N; i++){
        nodes.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - .5) * .20,
          vy: (Math.random() - .5) * .20,
          r: 1.0 + Math.random() * 1.5,
          p: Math.random() * Math.PI * 2,
          sp: .006 + Math.random() * .01
        });
      }

      function draw(){
        ctx.clearRect(0, 0, c.width, c.height);

        for(var i=0; i<N; i++){
          for(var j=i+1; j<N; j++){
            var dx = nodes[i].x - nodes[j].x;
            var dy = nodes[i].y - nodes[j].y;
            var d = Math.sqrt(dx*dx + dy*dy);
            if(d < 240){
              var a = (1 - d/240) * 0.10;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.strokeStyle = 'rgba(139,165,255,' + a + ')';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }

        for(var i=0; i<N; i++){
          var n = nodes[i];
          n.p += n.sp;
          var glow = .4 + .4 * Math.sin(n.p);

          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + (glow * 0.6) + ')';
          ctx.fill();

          n.x += n.vx; n.y += n.vy;
          if(n.x < -20) n.x = c.width + 20;
          else if(n.x > c.width + 20) n.x = -20;
          if(n.y < -20) n.y = c.height + 20;
          else if(n.y > c.height + 20) n.y = -20;
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
  <script src="{% static 'scripts/main.js' %}"></script>
</body>
</html>
